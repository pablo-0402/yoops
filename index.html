<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Para Sofi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Caveat:wght@500&family=League+Spartan:wght@600;700;800;900&display=swap"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prefixfree/1.0.7/prefixfree.min.js"></script>
    <style>
      :root {
        --crema: #FBF3E4;
        --papel: #F0E4D0;
        --cafe: #6A4B18;
        --vino: #7A1F2B;
        --verde: #23402F;
        --azul: #8DB0DA;
        --serif: "Cormorant Garamond", Georgia, serif;
        --mano: "Caveat", "Comic Sans MS", cursive;
        --sans: "League Spartan", "Futura", "Century Gothic", Arial, sans-serif;
      }
      html, body { height: 100%; }
      body { overflow: hidden; }
      .hidden { display: none !important; }

      /* ---------- Escenas ---------- */
      .scene {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s ease;
        -webkit-overflow-scrolling: touch;
      }
      .scene.active { opacity: 1; pointer-events: auto; z-index: 5; }
      .btn {
        display: inline-block;
        border: none;
        border-radius: 999px;
        padding: 12px 26px;
        font-family: var(--sans);
        font-weight: 900;
        font-size: 15px;
        letter-spacing: 1.5px;
        cursor: pointer;
      }
      .btn-vino { background: var(--vino); color: var(--crema); }
      .btn-crema { background: var(--papel); color: var(--cafe); }

      /* ---------- 1. Candado ---------- */
      #sLock {
        background: var(--azul);
        color: #fff;
        text-align: center;
        font-family: var(--serif);
      }
      #sLock h1 {
        font-style: italic;
        font-weight: 500;
        font-size: 46px;
        margin: 54px 0 6px;
      }
      #sLock .ramo { width: 190px; height: 190px; margin: 6px auto 0; display: block; }
      .pin-label {
        font-family: var(--sans);
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 3px;
        margin-top: 10px;
        opacity: 0.9;
      }
      .pin-dots { display: flex; justify-content: center; gap: 14px; margin: 16px 0 20px; }
      .pin-dots span {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        border: 1.5px solid #fff;
        transition: background 0.15s;
      }
      .pin-dots span.on { background: #fff; }
      .pin-dots.mal { animation: temblor 0.4s; }
      @keyframes temblor {
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
      }
      .teclado {
        display: grid;
        grid-template-columns: repeat(3, 66px);
        gap: 14px;
        justify-content: center;
        padding-bottom: 40px;
      }
      .teclado button {
        width: 66px;
        height: 66px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.22);
        color: #fff;
        font-family: var(--sans);
        font-weight: 800;
        font-size: 27px;
        cursor: pointer;
      }
      .teclado button:active { background: rgba(255, 255, 255, 0.45); }
      .teclado .vacio { visibility: hidden; }
      .teclado .borrar { font-size: 15px; background: transparent; }

      /* ---------- 2. Sobre ---------- */
      #sEnvelope {
        background: #E9DDC7;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-family: var(--serif);
      }
      .sobre {
        position: relative;
        width: 300px;
        height: 196px;
        background: #F3E9D6;
        border-radius: 4px;
        box-shadow: 0 20px 40px rgba(90, 60, 20, 0.28);
      }
      .sobre .tapa {
        position: absolute;
        inset: 0 0 auto 0;
        height: 62%;
        background: #EADBC0;
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        transform-origin: top;
        transition: transform 0.9s ease;
        z-index: 2;
      }
      #sEnvelope.open .tapa { transform: rotateX(180deg); z-index: 0; }
      .sobre .sello {
        position: absolute;
        top: 45%;
        left: 50%;
        width: 64px;
        height: 64px;
        margin: -32px 0 0 -32px;
        z-index: 3;
        filter: drop-shadow(0 3px 3px rgba(80, 10, 20, 0.35));
        transition: opacity 0.4s, transform 0.4s;
      }
      #sEnvelope.open .sello { opacity: 0; transform: scale(1.2); }
      .sobre .nombres {
        position: absolute;
        bottom: 10px;
        left: 0;
        right: 0;
        text-align: center;
        color: var(--cafe);
        font-style: italic;
        font-weight: 600;
        font-size: 20px;
        line-height: 1.25;
      }
      .tocar {
        margin-top: 30px;
        color: var(--cafe);
        font-family: var(--sans);
        font-weight: 900;
        font-size: 13px;
        letter-spacing: 3px;
        animation: latido 1.6s ease-in-out infinite;
      }
      @keyframes latido { 50% { opacity: 0.3; } }

      /* ---------- 3. Pastel ---------- */
      #sCake { background: #333; }
      #sCake .candle-count-display {
        margin-top: 110px;
        font-family: var(--sans);
        font-weight: 800;
        font-size: 18px;
      }
      #shareBtn, #shareMsg { font-family: var(--sans) !important; font-weight: 800; font-size: 15px !important; }
      #shareBox {
        position: absolute;
        bottom: 34px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: var(--sans);
      }

      /* ---------- 4. Video ---------- */
      #sVideo {
        background: #2B2B2B;
        text-align: center;
        padding: 84px 16px 50px;
        box-sizing: border-box;
        font-family: var(--serif);
      }
      #sVideo h1 { color: var(--papel); font-weight: 500; font-size: 32px; line-height: 1.15; max-width: 520px; margin: 0 auto 20px; }
      #sVideo video {
        display: block;
        margin: 0 auto;
        width: auto;
        max-width: 100%;
        max-height: 66vh;
        border-radius: 12px;
        background: #000;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      }
      #sVideo .btn { margin-top: 26px; }

      /* ---------- 5. Mixtape ---------- */
      #sMixtape {
        background: var(--crema);
        color: var(--verde);
        font-family: var(--serif);
        padding: 76px 22px 50px;
        box-sizing: border-box;
      }
      .mix { max-width: 560px; margin: 0 auto; }
      .mix .para {
        font-family: var(--sans);
        font-weight: 900;
        font-size: 11px;
        letter-spacing: 2.5px;
        color: var(--vino);
      }
      .mix h2 { font-weight: 500; font-size: 42px; margin: 4px 0 18px; }
      .cassette {
        width: 380px;
        max-width: 100%;
        margin: 0 auto 26px;
        filter: drop-shadow(0 14px 18px rgba(35, 64, 47, 0.3));
      }
      .cassette svg { display: block; width: 100%; height: auto; }
      .cassette .rueda > g { transform-box: fill-box; transform-origin: center; }
      .cassette.sonando .rueda > g { animation: girar 2.4s linear infinite; }
      @keyframes girar { to { transform: rotate(360deg); } }
      .pistas { border-top: 1px solid rgba(35, 64, 47, 0.2); margin-bottom: 20px; }
      .pista {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 2px;
        border-bottom: 1px solid rgba(35, 64, 47, 0.2);
        cursor: pointer;
      }
      .pista .num { font-style: italic; font-size: 18px; width: 22px; }
      .pista .txt { flex: 1; font-family: var(--sans); }
      .pista .t { font-size: 15px; font-weight: 800; color: #222; }
      .pista .a { font-size: 12px; font-weight: 600; opacity: 0.65; }
      .pista .play {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--vino);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
      }
      .nota {
        background: #FBE8B7;
        padding: 18px 20px;
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
        transform: rotate(-1deg);
      }
      .nota .lbl { font-family: var(--sans); font-weight: 900; font-size: 11px; letter-spacing: 2px; margin-bottom: 6px; }
      .nota p { margin: 0; font-style: italic; font-size: 21px; line-height: 1.35; }
      .tira {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding: 24px 4px 14px;
      }
      .polaroid {
        flex: none;
        background: #fff;
        padding: 8px 8px 26px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
        cursor: zoom-in;
      }
      .polaroid img { display: block; width: 130px; height: 150px; object-fit: cover; }
      .tira .polaroid:nth-child(odd) { transform: rotate(-3deg); }
      .tira .polaroid:nth-child(even) { transform: rotate(2.5deg); }
      .mix .seguir { text-align: center; margin-top: 18px; }

      /* ---------- 6. Scrapbook ---------- */
      #sScrap {
        background:
          radial-gradient(circle at 20% 10%, rgba(255,255,255,0.06), transparent 40%),
          var(--verde);
        padding: 76px 14px 60px;
        box-sizing: border-box;
        text-align: center;
      }
      #sScrap h2 {
        font-family: var(--mano);
        font-weight: 500;
        color: var(--papel);
        font-size: 34px;
        margin: 0 auto 26px;
        max-width: 520px;
        line-height: 1.1;
      }
      .collage {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 18px 14px;
        max-width: 900px;
        margin: 0 auto;
      }
      .collage .polaroid img { width: 140px; height: 165px; }
      .collage .polaroid { position: relative; }
      .collage .polaroid::before {
        content: "";
        position: absolute;
        top: -9px;
        left: 50%;
        width: 54px;
        height: 18px;
        margin-left: -27px;
        background: rgba(240, 228, 208, 0.75);
        transform: rotate(-4deg);
      }

      /* ---------- Cortina de flores ---------- */
      #cortina { position: fixed; inset: 0; z-index: 55; pointer-events: none; overflow: hidden; }
      #cortina.cerrada { pointer-events: auto; }
      #cortina .lado {
        position: absolute;
        top: 0;
        bottom: 0;
        width: calc(50% + 70px);
        transition: transform 0.95s cubic-bezier(0.65, 0, 0.25, 1);
        will-change: transform;
      }
      #cortina .lado canvas { display: block; width: 100%; height: 100%; }
      #cortina .izq { left: 0; transform: translateX(-102%); }
      #cortina .der { right: 0; transform: translateX(102%); }
      #cortina.cerrada .izq, #cortina.cerrada .der { transform: translateX(0); }
      .petalo {
        position: fixed;
        top: -30px;
        z-index: 56;
        pointer-events: none;
        border-radius: 70% 0 70% 0;
        animation: caer linear forwards;
      }
      @keyframes caer {
        0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
        10% { opacity: 1; }
        50% { transform: translate(var(--dx), 55vh) rotate(220deg); }
        100% { transform: translate(calc(var(--dx) * -0.4), 115vh) rotate(460deg); opacity: 0.9; }
      }

      /* ---------- Foto grande ---------- */
      #lightbox {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: zoom-out;
      }
      #lightbox img { max-width: 92vw; max-height: 86vh; border: 8px solid #fff; }

      /* ---------- Reproductor (vidrio) ---------- */
      #player {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 6px 6px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.35);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
        font-family: var(--sans);
        max-width: calc(100vw - 130px);
      }
      #player .info { display: flex; flex-direction: column; min-width: 0; }
      #player .label { font-size: 9.5px; font-weight: 900; letter-spacing: 1.5px; opacity: 0.8; }
      #player .titulo { font-size: 13.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #playBtn {
        flex: none;
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 50%;
        background: #fff;
        color: #333;
        font-size: 11px;
        cursor: pointer;
      }
      #player.claro {
        background: rgba(255, 255, 255, 0.6);
        color: #3A2A14;
        text-shadow: none;
        border-color: rgba(106, 75, 24, 0.15);
      }
      #player.claro #playBtn { background: #3A2A14; color: #fff; }
      #ytHolder {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 1px;
        height: 1px;
        opacity: 0.001;
        pointer-events: none;
        overflow: hidden;
      }
      /* En el sobre, el reproductor de YouTube cubre la pantalla (invisible):
         así el toque cae en YouTube y el teléfono deja sonar la música */
      #ytHolder.encima {
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 20;
        pointer-events: auto;
      }
      #ytHolder iframe { width: 100%; height: 100%; }
      #backBtn {
        position: fixed;
        top: 16px;
        left: 12px;
        z-index: 41;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.2);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        color: #fff;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
      }
      #backBtn.claro { background: rgba(255, 255, 255, 0.6); color: #3A2A14; border-color: rgba(106, 75, 24, 0.15); }
    </style>
  </head>
  <body>
    <!-- Reproductor -->
    <div id="player" class="hidden">
      <div class="info">
        <span class="label">SONANDO AHORA</span>
        <span class="titulo" id="songTitle">Nuestra canción</span>
      </div>
      <button id="playBtn" aria-label="Reproducir o pausar">&#9654;</button>
    </div>
    <div id="ytHolder"><div id="yt"></div></div>
    <button id="backBtn" class="hidden" aria-label="Regresar">&larr;</button>

    <!-- 1. Candado -->
    <section class="scene" id="sLock">
      <h1 id="lockTitle"></h1>
      <svg class="ramo" viewBox="0 0 200 200" aria-hidden="true">
        <path d="M70 120 L100 196 L130 120 Z" fill="#F4EAD8" />
        <path d="M70 120 L100 196 L100 120 Z" fill="#E6D8BF" />
        <path d="M86 156 q14 10 28 0 M100 160 l-10 22 M100 160 l12 20" stroke="#E7A2B0" stroke-width="4" fill="none" stroke-linecap="round" />
        <g fill="#6E9B78">
          <ellipse cx="58" cy="96" rx="16" ry="7" transform="rotate(-30 58 96)" />
          <ellipse cx="144" cy="94" rx="16" ry="7" transform="rotate(30 144 94)" />
          <ellipse cx="80" cy="70" rx="12" ry="5" transform="rotate(-60 80 70)" />
          <ellipse cx="124" cy="66" rx="12" ry="5" transform="rotate(60 124 66)" />
        </g>
        <g>
          <circle cx="100" cy="92" r="22" fill="#F2A7B5" /><circle cx="100" cy="92" r="11" fill="#E0788D" />
          <circle cx="72" cy="104" r="17" fill="#F7D774" /><circle cx="72" cy="104" r="6" fill="#E3A93B" />
          <circle cx="128" cy="106" r="18" fill="#F6C2A6" /><circle cx="128" cy="106" r="8" fill="#E48F6E" />
          <circle cx="84" cy="74" r="14" fill="#C9B6E8" /><circle cx="84" cy="74" r="5" fill="#9C82CF" />
          <circle cx="118" cy="76" r="15" fill="#FFFFFF" /><circle cx="118" cy="76" r="5" fill="#F3CF5A" />
          <circle cx="100" cy="118" r="13" fill="#E86A7E" /><circle cx="100" cy="118" r="5" fill="#B9435A" />
        </g>
      </svg>
      <div class="pin-label">ESCRIBÍ EL CÓDIGO</div>
      <div class="pin-dots" id="pinDots"><span></span><span></span><span></span><span></span></div>
      <div class="teclado" id="teclado"></div>
    </section>

    <!-- 2. Sobre -->
    <section class="scene" id="sEnvelope">
      <div class="sobre">
        <div class="tapa"></div>
        <svg class="sello" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <radialGradient id="cera" cx="36%" cy="30%" r="80%">
              <stop offset="0" stop-color="#D2505F" />
              <stop offset="0.5" stop-color="#A2202F" />
              <stop offset="1" stop-color="#6A0E1A" />
            </radialGradient>
            <radialGradient id="ceraIn" cx="62%" cy="68%" r="70%">
              <stop offset="0" stop-color="#B83545" />
              <stop offset="1" stop-color="#7C1423" />
            </radialGradient>
          </defs>
          <path d="M50 3 C61 2 69 8 78 11 C89 15 97 26 95 38 C99 48 98 60 93 69 C89 80 80 88 69 93 C59 98 46 99 36 95 C24 92 12 85 7 73 C2 62 1 50 5 39 C8 27 15 15 27 9 C34 5 42 4 50 3 Z" fill="url(#cera)" />
          <path d="M84 76 C88 82 90 88 86 90 C82 91 81 85 82 79 Z" fill="#8E1726" />
          <circle cx="50" cy="50" r="31" fill="url(#ceraIn)" />
          <circle cx="50" cy="50" r="31" fill="none" stroke="#E07784" stroke-opacity="0.55" stroke-width="1.6" />
          <circle cx="50" cy="50" r="26" fill="none" stroke="#5E0C17" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="1.5 2.5" />
          <path d="M50 64 C38 55 33 49 33 43 C33 37 38 34 42 34 C46 34 48 36 50 39 C52 36 54 34 58 34 C62 34 67 37 67 43 C67 49 62 55 50 64 Z" fill="#6E1020" />
          <path d="M50 62 C39 54 35 49 35 43.5 C35 38.5 39 36 42.5 36 C46 36 48 38 50 41 C52 38 54 36 57.5 36 C61 36 65 38.5 65 43.5 C65 49 61 54 50 62 Z" fill="none" stroke="#E58A95" stroke-opacity="0.6" stroke-width="1.2" />
          <ellipse cx="34" cy="24" rx="12" ry="6" transform="rotate(-30 34 24)" fill="#fff" opacity="0.18" />
        </svg>
        <div class="nombres">
          <div id="sobrePara"></div>
          <div id="sobreDe"></div>
        </div>
      </div>
      <div class="tocar">TOCÁ PARA ABRIR</div>
    </section>

    <!-- 3. Pastel -->
    <section class="scene" id="sCake">
      <div class="candle-count-display">
        Velas en el pastel: <span id="candleCount">0</span>
      </div>
      <div class="cake">
        <div class="plate"></div>
        <div class="layer layer-bottom"></div>
        <div class="layer layer-middle"></div>
        <div class="layer layer-top"></div>
        <div class="icing"></div>
        <div class="drip drip1"></div>
        <div class="drip drip2"></div>
        <div class="drip drip3"></div>
      </div>
      <div id="shareBox">
        <button id="shareBtn">Copiar link para enviar</button>
        <span id="shareMsg"></span>
      </div>
    </section>

    <!-- 4. Video -->
    <section class="scene" id="sVideo">
      <h1 id="videoTitle"></h1>
      <video id="video" src="video.mp4" playsinline muted controls preload="auto"></video>
      <div><button class="btn btn-crema" data-next="sMixtape">SEGUIR</button></div>
    </section>

    <!-- 5. Mixtape -->
    <section class="scene" id="sMixtape">
      <div class="mix">
        <div class="para" id="mixPara"></div>
        <h2 id="mixTitle"></h2>
        <div class="cassette" id="cassette">
          <svg viewBox="0 0 640 400" aria-hidden="true">
            <defs>
              <linearGradient id="carcasa" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#A69C92" stop-opacity="0.78" />
                <stop offset="0.5" stop-color="#857A70" stop-opacity="0.72" />
                <stop offset="1" stop-color="#6E645B" stop-opacity="0.8" />
              </linearGradient>
              <pattern id="rejilla" width="7" height="7" patternUnits="userSpaceOnUse">
                <path d="M7 0 H0 V7" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="0.8" />
                <path d="M7 7 H0" fill="none" stroke="#3B342E" stroke-opacity="0.18" stroke-width="0.6" />
              </pattern>
              <radialGradient id="tornilloOsc" cx="35%" cy="35%" r="70%">
                <stop offset="0" stop-color="#5A5550" />
                <stop offset="1" stop-color="#151515" />
              </radialGradient>
              <radialGradient id="carrete" cx="40%" cy="35%" r="70%">
                <stop offset="0" stop-color="#FFFFFF" />
                <stop offset="1" stop-color="#C9C9C9" />
              </radialGradient>
              <radialGradient id="rodillo" cx="40%" cy="35%" r="70%">
                <stop offset="0" stop-color="#F6EEDB" />
                <stop offset="1" stop-color="#CDBF9E" />
              </radialGradient>
              <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22" />
                <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0" />
                <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.06" />
                <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
              </linearGradient>
              <linearGradient id="ventanaCentro" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#3B302A" />

      /* ===================================================== */

      function ytId(url) {
        const m = (url || "").match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
        return m ? m[1] : "";
      }

      // ---------- Música (YouTube) ----------
      let player = null;
      let playerReady = false;
      let pending = null;
      let currentId = "";
      const playBtn = document.getElementById("playBtn");
      const songTitle = document.getElementById("songTitle");

      (function loadYT() {
        const tag = document.createElement("script");
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);
      })();

      window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player("yt", {
          width: 200,
          height: 200,
          videoId: ytId(CONFIG.cancion),
          playerVars: { playsinline: 1, controls: 0, start: CONFIG.inicio },
          events: {
            onReady: function () {
              playerReady = true;
              if (document.getElementById("sEnvelope").classList.contains("active"))
                document.getElementById("ytHolder").classList.add("encima");
              if (pending) { const p = pending; pending = null; playSong(p.url, p.start); }
            },
            onStateChange: function (e) {
              const playing = e.data === YT.PlayerState.PLAYING;
              if (playing) {
                currentId = player.getVideoData().video_id;
                document.getElementById("player").classList.remove("hidden");
                if (typeof openEnvelope === "function") openEnvelope();
              }
              playBtn.innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
              document.getElementById("cassette").classList.toggle("sonando", playing);
              const data = player.getVideoData && player.getVideoData();
              if (data && data.title) songTitle.textContent = data.title;
              if (e.data === YT.PlayerState.ENDED) player.playVideo();
            },
          },
        });
      };

      // Llamar siempre desde un toque, para que el teléfono deje sonar la música
      function playSong(url, start) {
        const id = ytId(url);
        if (!id) return;
        document.getElementById("player").classList.remove("hidden");
        if (!playerReady) { pending = { url, start }; return; }
        if (id === currentId) { player.playVideo(); return; }
        currentId = id;
        if (id === player.getVideoData().video_id) {
          player.seekTo(start || 0, true);
          player.playVideo();
        } else {
          player.loadVideoById({ videoId: id, startSeconds: start || 0 });
        }
      }

      playBtn.addEventListener("click", function () {
        if (!playerReady) return;
        if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
        else player.playVideo();
      });

      // ---------- Cortina de flores ----------
      // Cortinas pintadas con flores (rosas, peonías y nube) sobre follaje
      function azar(seed) {
        return function () {
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function tono(hex, k) {
        const n = parseInt(hex.slice(1), 16);
        let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
        const m = k > 0 ? 255 : 0, a = Math.abs(k);
        r = Math.round(r + (m - r) * a); g = Math.round(g + (m - g) * a); b = Math.round(b + (m - b) * a);
        return `rgb(${r},${g},${b})`;
      }
      function hojaC(ctx, x, y, len, ang) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(ang);
        const g = ctx.createLinearGradient(0, -len * 0.3, 0, len * 0.3);
        g.addColorStop(0, "#7FA874"); g.addColorStop(0.5, "#557F52"); g.addColorStop(1, "#2F4D30");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(len * 0.5, -len * 0.34, len, 0);
        ctx.quadraticCurveTo(len * 0.5, len * 0.34, 0, 0);
        ctx.fill();
        ctx.strokeStyle = "rgba(220,240,210,0.35)";
        ctx.lineWidth = Math.max(0.8, len * 0.025);
        ctx.beginPath(); ctx.moveTo(len * 0.05, 0); ctx.lineTo(len * 0.9, 0); ctx.stroke();
        ctx.restore();
      }
      function petalo(ctx, px, py, rx, ry, ang, grad, borde, lw) {
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(ang);
        ctx.beginPath();
        // pétalo con punta suave, no círculo perfecto
        ctx.moveTo(-rx, 0);
        ctx.bezierCurveTo(-rx, -ry * 1.05, rx * 0.9, -ry * 1.1, rx, -ry * 0.1);
        ctx.bezierCurveTo(rx * 1.05, ry * 0.9, -rx * 0.8, ry * 1.1, -rx, 0);
        ctx.restore();
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = borde;
        ctx.lineWidth = lw;
        ctx.stroke();
      }
      function rosa(ctx, x, y, r, color, R) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(R() * Math.PI * 2);
        const capas = [[1, 6, 0.5], [0.8, 5, 0.44], [0.6, 5, 0.37], [0.42, 4, 0.3], [0.26, 3, 0.22]];
        capas.forEach(([rad, n, tam], L) => {
          const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * rad * 1.15);
          g.addColorStop(0, tono(color, -0.42));
          g.addColorStop(0.55, tono(color, -0.08 * L));
          g.addColorStop(1, tono(color, 0.22 - L * 0.05));
          ctx.shadowColor = "rgba(50,15,20,0.32)";
          ctx.shadowBlur = r * (L === 0 ? 0.35 : 0.14);
          ctx.shadowOffsetY = r * (L === 0 ? 0.1 : 0.04);
          for (let i = 0; i < n; i++) {
            const a = (i / n) * Math.PI * 2 + L * 0.7 + R() * 0.3;
            petalo(ctx, Math.cos(a) * r * rad * 0.42, Math.sin(a) * r * rad * 0.42,
              r * tam, r * tam * 0.85, a + Math.PI / 2, g, tono(color, -0.25), Math.max(0.6, r * 0.018));
          }
        });
        ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
        ctx.strokeStyle = tono(color, -0.5);
        ctx.lineWidth = Math.max(0.8, r * 0.03);
        ctx.beginPath();
        for (let t = 0; t < Math.PI * 4; t += 0.2) {
          const rr = r * 0.02 + t * r * 0.011;
          ctx.lineTo(Math.cos(t) * rr, Math.sin(t) * rr);
        }
        ctx.stroke();
        ctx.restore();
      }
      function peonia(ctx, x, y, r, color, R) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(R() * Math.PI * 2);
        for (let L = 0; L < 4; L++) {
          const rad = 1 - L * 0.22, n = 11 - L * 2;
          const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * rad * 1.1);
          g.addColorStop(0, tono(color, -0.3));
          g.addColorStop(0.6, color);
          g.addColorStop(1, tono(color, 0.3));
          ctx.shadowColor = "rgba(60,30,30,0.28)";
          ctx.shadowBlur = r * (L === 0 ? 0.3 : 0.1);
          ctx.shadowOffsetY = r * (L === 0 ? 0.08 : 0.03);
          for (let i = 0; i < n; i++) {
            const a = (i / n) * Math.PI * 2 + L * 0.45 + R() * 0.4;
            const d = r * rad * (0.5 + R() * 0.1);
            petalo(ctx, Math.cos(a) * d, Math.sin(a) * d, r * 0.32 * rad + r * 0.08, r * 0.26 * rad + r * 0.06,
              a + Math.PI / 2 + (R() - 0.5) * 0.5, g, tono(color, -0.18), Math.max(0.5, r * 0.014));
          }
        }
        ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
        for (let i = 0; i < 14; i++) {
          const a = R() * Math.PI * 2, d = R() * r * 0.14;
          ctx.fillStyle = i % 3 ? "#E9C25A" : "#B98A2E";
          ctx.beginPath(); ctx.arc(Math.cos(a) * d, Math.sin(a) * d, r * 0.035, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }
      function nube(ctx, x, y, s, R) {
        for (let i = 0; i < 11; i++) {
          const a = R() * Math.PI * 2, d = R() * s;
          const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d, rr = s * (0.1 + R() * 0.08);
          ctx.fillStyle = "rgba(255,255,255,0.95)";
          ctx.shadowColor = "rgba(0,0,0,0.25)"; ctx.shadowBlur = rr;
          ctx.beginPath(); ctx.arc(px, py, rr, 0, Math.PI * 2); ctx.fill();
        }
        ctx.shadowBlur = 0;
      }
      const COLORES = [
        ["#F3C4C8", 30], ["#E59AA8", 20], ["#F5E8D8", 14], ["#FBF6F0", 12],
        ["#F1B597", 10], ["#C8566E", 9], ["#93303F", 5],
      ];
      function colorAzar(R) {
        let t = R() * 100;
        for (const [c, w] of COLORES) { if ((t -= w) < 0) return c; }
        return COLORES[0][0];
      }
      function pintarLado(canvas, seed, espejo) {
        const dpr = Math.min(window.devicePixelRatio || 1, window.innerWidth > 900 ? 1.25 : 2);
        const cssW = canvas.parentElement.getBoundingClientRect().width || window.innerWidth / 2 + 70;
        const cssH = window.innerHeight;
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        const ctx = canvas.getContext("2d");
        const R = azar(seed);
        const W = cssW, H = cssH, base = W - 70; // zona sólida; el resto es el borde con flores sueltas
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (espejo) { ctx.translate(W, 0); ctx.scale(-1, 1); }
        // follaje de fondo
        const fondo = ctx.createLinearGradient(0, 0, 0, H);
        fondo.addColorStop(0, "#3E5E40"); fondo.addColorStop(1, "#22382A");
        ctx.fillStyle = fondo;
        ctx.fillRect(0, 0, base - 10, H);
        for (let k = 0; k < (base * H) / 900; k++)
          hojaC(ctx, R() * (base + 20), R() * H, 16 + R() * 26, R() * Math.PI * 2);
        // flores
        const celda = Math.max(52, Math.min(78, W / 4.2));
        const lista = [];
        for (let y = -celda * 0.3; y < H + celda * 0.5; y += celda * 0.82)
          for (let x = celda * 0.2; x < base + 30; x += celda * 0.9)
            lista.push([x + (R() - 0.5) * celda * 0.5, y + (R() - 0.5) * celda * 0.5, celda * (0.46 + R() * 0.22)]);
        for (let k = 0; k < 9 + H / 90; k++)
          lista.push([base - 10 + R() * 52, R() * H, celda * (0.38 + R() * 0.2)]); // flores que sobresalen del borde
        for (let k = lista.length - 1; k > 0; k--) {
          const m = Math.floor(R() * (k + 1)); [lista[k], lista[m]] = [lista[m], lista[k]];
        }
        lista.forEach(([x, y, r]) => {
          if (R() < 0.35) hojaC(ctx, x, y, r * 1.5, R() * Math.PI * 2);
          const c = colorAzar(R);
          (R() < 0.62 ? rosa : peonia)(ctx, x, y, r, c, R);
        });
        for (let k = 0; k < (base * H) / 9000; k++) nube(ctx, R() * base, R() * H, celda * 0.32, R);
        // luz y sombra suaves
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        const luz = ctx.createLinearGradient(0, 0, 0, canvas.height);
        luz.addColorStop(0, "rgba(255,240,230,0.10)");
        luz.addColorStop(1, "rgba(30,10,10,0.22)");
        ctx.globalCompositeOperation = "source-atop";
        ctx.fillStyle = luz;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalCompositeOperation = "source-over";
      }
      let anchoPintado = 0;
      function pintarCortinas() {
        if (Math.abs(window.innerWidth - anchoPintado) < 40) return;
        anchoPintado = window.innerWidth;
        const [a, b] = document.querySelectorAll("#cortina canvas");
        pintarLado(a, 7, false);
        pintarLado(b, 23, true);
      }
      setTimeout(pintarCortinas, 60);
      let tResize;
      window.addEventListener("resize", () => { clearTimeout(tResize); tResize = setTimeout(pintarCortinas, 300); });

      function lluviaDePetalos() {
        const cols = ["#F3C4C8", "#E59AA8", "#FBF6F0", "#F1B597", "#C8566E"];
        for (let i = 0; i < 18; i++) {
          const p = document.createElement("div");
          p.className = "petalo";
          const t = 10 + Math.random() * 10, c = cols[i % cols.length];
          p.style.width = t + "px";
          p.style.height = t * 0.8 + "px";
          p.style.left = Math.random() * 100 + "vw";
          p.style.background = `radial-gradient(circle at 30% 30%, #fff8, ${c} 55%, ${c})`;
          p.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
          p.style.animationDuration = 1.8 + Math.random() * 1.4 + "s";
          p.style.animationDelay = Math.random() * 0.6 + "s";
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 4200);
        }
      }

      let enTransicion = false;
      function transition(id) {
        if (enTransicion) return;
        enTransicion = true;
        const c = document.getElementById("cortina");
        c.classList.add("cerrada");
        lluviaDePetalos();
        setTimeout(() => {
          go(id);
          setTimeout(() => {
            c.classList.remove("cerrada");
            setTimeout(() => (enTransicion = false), 950);
          }, 380);
        }, 1000);
      }

      // ---------- Escenas ----------
      function go(id) {
        document.querySelectorAll(".scene").forEach((s) => s.classList.remove("active"));
        const el = document.getElementById(id);
        el.classList.add("active");
        el.scrollTop = 0;
        document.getElementById("player").classList.toggle("claro", id === "sEnvelope" || id === "sMixtape");
        if (id === "sVideo") document.getElementById("video").play().catch(() => {});
        else document.getElementById("video").pause();
        // Música más baja mientras sopla, para que el micrófono no la confunda con un soplido
        if (playerReady) player.setVolume(id === "sCake" ? 25 : 100);
        document.getElementById("ytHolder").classList.toggle("encima", id === "sEnvelope" && playerReady);
        const back = document.getElementById("backBtn");
        back.classList.toggle("hidden", !BACK[id]);
        back.classList.toggle("claro", id === "sMixtape");
      }
      const BACK = { sVideo: "sCake", sMixtape: "sVideo", sScrap: "sMixtape" };
      document.getElementById("backBtn").addEventListener("click", () => {
        const id = document.querySelector(".scene.active").id;
        if (BACK[id] === "sCake") relightCandles();
        if (BACK[id]) transition(BACK[id]);
      });
      document.querySelectorAll("[data-next]").forEach((b) =>
        b.addEventListener("click", () => {
          // la canción se pide en el mismo toque para que el teléfono la deje sonar
          if (b.dataset.next === "sScrap") playSong(CONFIG.cancionScrapbook, 0);
          transition(b.dataset.next);
        })
      );

      // ---------- Textos y fotos ----------
      function polaroid(src) {
        const div = document.createElement("div");
        div.className = "polaroid";
        const img = document.createElement("img");
        img.src = src;
        img.loading = "lazy";
        img.alt = "";
        img.onerror = () => div.remove();
        div.appendChild(img);
        div.addEventListener("click", () => {
          document.getElementById("lightboxImg").src = src;
          document.getElementById("lightbox").classList.remove("hidden");
        });
        return div;
      }
      document.getElementById("lightbox").addEventListener("click", function () {
        this.classList.add("hidden");
      });

      document.getElementById("lockTitle").textContent = CONFIG.tituloCandado;
      document.getElementById("sobrePara").textContent = "Para: " + CONFIG.para;
      document.getElementById("sobreDe").textContent = "De: " + CONFIG.de;
      document.getElementById("videoTitle").textContent = CONFIG.tituloVideo;
      document.getElementById("mixPara").textContent =
        ("PARA " + CONFIG.para + " · DE " + CONFIG.de).toUpperCase();
      document.getElementById("mixTitle").textContent = CONFIG.tituloMixtape;
      document.getElementById("mixTitle2").textContent = CONFIG.tituloMixtape;
      document.getElementById("mixNota").textContent = CONFIG.notaMixtape;
      document.getElementById("scrapTitle").textContent = CONFIG.tituloScrapbook;

      const pistasEl = document.getElementById("pistas");
      CONFIG.pistas.forEach((p, i) => {
        const row = document.createElement("div");
        row.className = "pista";
        row.innerHTML =
          '<span class="num">0' + (i + 1) + '</span><span class="txt"><div class="t"></div><div class="a"></div></span><span class="play">&#9654;</span>';
        row.querySelector(".t").textContent = p.titulo;
        row.querySelector(".a").textContent = p.artista;
        row.addEventListener("click", () => playSong(p.url, 0));
        pistasEl.appendChild(row);
      });
      CONFIG.fotosMixtape.forEach((f) => document.getElementById("tiraFotos").appendChild(polaroid(f)));
      if (!CONFIG.fotosMixtape.length) document.getElementById("tiraFotos").style.display = "none";
      const collage = document.getElementById("collage");
      CONFIG.fotosScrapbook.forEach((f) => {
        const p = polaroid(f);
        p.style.transform = "rotate(" + (Math.random() * 10 - 5).toFixed(1) + "deg)";
        collage.appendChild(p);
      });

      // ---------- Pastel ----------
      const cake = document.querySelector(".cake");
      const candleCountDisplay = document.getElementById("candleCount");
      const shareBtn = document.getElementById("shareBtn");
      const shareMsg = document.getElementById("shareMsg");
      let candles = [];
      let audioContext, analyser;
      let micStarted = false;
      let finished = false;
      let isRecipient = false;

      function updateCandleCount() {
        const active = candles.filter((c) => !c.classList.contains("out")).length;
        candleCountDisplay.textContent = active;
        if (isRecipient && candles.length > 0 && active === 0 && !finished) {
          finished = true;
          setTimeout(() => transition("sVideo"), 1500);
        }
      }

      function relightCandles() {
        candles.forEach((c) => c.classList.remove("out"));
        finished = false;
        updateCandleCount();
      }

      function addCandle(left, top) {
        const candle = document.createElement("div");
        candle.className = "candle";
        candle.style.left = left + "px";
        candle.style.top = top + "px";
        candle.dataset.x = Math.round(left);
        candle.dataset.y = Math.round(top);
        const flame = document.createElement("div");
        flame.className = "flame";
        candle.appendChild(flame);
        cake.appendChild(candle);
        candles.push(candle);
        updateCandleCount();
      }

      // Las velas viajan dentro del link: #c=x.y,x.y,...
      function loadCandlesFromLink() {
        const match = location.hash.match(/c=([\d.,]+)/);
        if (!match) return false;
        match[1].split(",").forEach((pair) => {
          const [x, y] = pair.split(".").map(Number);
          if (!isNaN(x) && !isNaN(y)) addCandle(x, y);
        });
        return candles.length > 0;
      }

      function micLevel() {
        const data = new Float32Array(analyser.fftSize);
        analyser.getFloatTimeDomainData(data);
        let sum = 0;
        for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
        return Math.sqrt(sum / data.length);
      }

      function blowOutCandles() {
        if (finished || !document.getElementById("sCake").classList.contains("active")) return;
        if (micLevel() < 0.12) return;
        let blownOut = 0;
        candles.forEach((c) => {
          if (!c.classList.contains("out") && Math.random() > 0.5) {
            c.classList.add("out");
            blownOut++;
          }
        });
        if (blownOut > 0) updateCandleCount();
      }

      // El micrófono se activa con un toque y sin supresión de ruido (si no, borra el soplido)
      function startMic() {
        if (micStarted) return Promise.resolve();
        micStarted = true;
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        audioContext.resume();
        return navigator.mediaDevices
          .getUserMedia({ audio: { noiseSuppression: false, echoCancellation: false, autoGainControl: false } })
          .then((stream) => {
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 1024;
            audioContext.createMediaStreamSource(stream).connect(analyser);
            audioContext.resume();
            setInterval(blowOutCandles, 150);
            if (isRecipient) shareMsg.textContent = "Soplá al micrófono para apagar las velas";
          })
          .catch((err) => {
            micStarted = false;
            shareMsg.textContent = "No se pudo usar el micrófono. Revisá los permisos.";
            console.log("Unable to access microphone: " + err);
          });
      }

      isRecipient = loadCandlesFromLink();

      if (isRecipient) {
        // Ella: candado -> sobre -> pastel -> video -> mixtape -> scrapbook
        shareBtn.style.display = "none";
        let pin = "";
        const dots = document.getElementById("pinDots");
        const teclado = document.getElementById("teclado");
        ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "borrar"].forEach((k) => {
          const b = document.createElement("button");
          if (k === "") b.className = "vacio";
          else if (k === "borrar") { b.className = "borrar"; b.textContent = "Borrar"; }
          else b.textContent = k;
          b.addEventListener("click", () => {
            if (k === "borrar") pin = pin.slice(0, -1);
            else if (k && pin.length < 4) pin += k;
            [...dots.children].forEach((d, i) => d.classList.toggle("on", i < pin.length));
            if (pin.length === 4) {
              if (pin === CONFIG.codigo) {
                startMic();
                setTimeout(() => transition("sEnvelope"), 250);
              } else {
                dots.classList.add("mal");
                setTimeout(() => {
                  dots.classList.remove("mal");
                  pin = "";
                  [...dots.children].forEach((d) => d.classList.remove("on"));
                }, 450);
              }
            }
          });
          teclado.appendChild(b);
        });

        const env = document.getElementById("sEnvelope");
        window.openEnvelope = function () {
          if (!env.classList.contains("active") || env.classList.contains("open")) return;
          env.classList.add("open");
          document.getElementById("ytHolder").classList.remove("encima");
          if (audioContext) audioContext.resume();
          // Por si el toque no arrancó la canción (algunos navegadores)
          setTimeout(() => {
            if (playerReady && player.getPlayerState() !== YT.PlayerState.PLAYING) {
              currentId = "";
              playSong(CONFIG.cancion, CONFIG.inicio);
            }
          }, 1500);
          setTimeout(() => transition("sCake"), 1000);
        };
        env.addEventListener("click", () => {
          if (playerReady) playSong(CONFIG.cancion, CONFIG.inicio);
          openEnvelope();
        });
        // Cuando el toque cae dentro del reproductor de YouTube, la página pierde el foco
        window.addEventListener("blur", () =>
          setTimeout(() => {
            const a = document.activeElement;
            if (a && a.tagName === "IFRAME") {
              openEnvelope();
              a.blur();
            }
          }, 0)
        );

        go("sLock");
      } else {
        // Vos: poner velas y copiar el link
        cake.addEventListener("click", (event) => {
          startMic();
          const rect = cake.getBoundingClientRect();
          addCandle(event.clientX - rect.left, event.clientY - rect.top);
        });
        shareBtn.addEventListener("click", () => {
          if (candles.length === 0) {
            shareMsg.textContent = "Primero poné velas en el pastel";
            return;
          }
          const link = location.origin + location.pathname + "#c=" +
            candles.map((c) => c.dataset.x + "." + c.dataset.y).join(",");
          navigator.clipboard.writeText(link).then(
            () => (shareMsg.textContent = "Link copiado"),
            () => (shareMsg.textContent = link)
          );
        });
        go("sCake");
      }
    </script>
  </body>
</html>
